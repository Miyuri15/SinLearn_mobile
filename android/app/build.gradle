plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"   // ✅ FIXED (MATCHES settings.gradle)
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.example.sinlearn_mobile"

    compileSdk 35

    defaultConfig {
        applicationId "com.example.sinlearn_mobile"
        minSdk flutter.minSdkVersion
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source "../.."
}
